<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#0F2854" />
  <meta name="description" content="OraaSlayer - المنصة العربية الأولى للأنمي" />
  <meta property="og:title" content="OraaSlayer" />
  <meta property="og:description" content="المنصة العربية الأولى للأنمي" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>OraaSlayer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://graphql.anilist.co" />
  <link rel="preconnect" href="https://s4.anilist.co" crossorigin />
  <link rel="dns-prefetch" href="https://unpkg.com" />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" /></noscript>

  <link rel="stylesheet" href="/styles/shared.css" />
  <link rel="modulepreload" href="/api/firebase.js" />
  <link rel="modulepreload" href="/api/anilist.js" />
  <link rel="modulepreload" href="/api/auth.js" />
  <link rel="modulepreload" href="/pages/home.js" />
  <link rel="preload" href="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" as="script" crossorigin />

  <style>
    :root {
      color-scheme: dark;
      --c1: #0F2854;
      --c2: #1C4D8D;
      --c3: #4988C4;
      --c4: #BDE8F5;
      --gold: #FFCA28;
      --gold-soft: rgba(255, 202, 40, 0.18);
      --text: #FFFFFF;
      --text-dim: rgba(255, 255, 255, 0.84);
      --muted: rgba(189, 232, 245, 0.58);
      --bg: #08162f;
      --bg-deep: #071326;
      --border: rgba(189, 232, 245, 0.15);
      --shadow: 0 18px 50px rgba(0,0,0,.24);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --app-height: 100dvh;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: var(--app-height);
      background: var(--bg-deep);
      color: var(--text);
      font-family: 'Cairo', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      overflow-x: hidden;
      direction: rtl;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      text-rendering: optimizeLegibility;
    }

    body {
      background:
        radial-gradient(1100px circle at 15% 15%, rgba(73,136,196,0.18), transparent 35%),
        radial-gradient(900px circle at 85% 10%, rgba(255,202,40,0.08), transparent 28%),
        linear-gradient(180deg, #09152b 0%, #07111f 100%);
    }

    #app {
      min-height: var(--app-height);
      position: relative;
      contain: layout style paint;
      transition: opacity .16s ease, transform .16s ease, filter .16s ease;
    }

    #app.is-navigating {
      opacity: 0.22;
      transform: translateY(1px);
      filter: blur(.2px);
    }

    #app.is-entering {
      opacity: 0;
      transform: translateY(4px);
      filter: blur(.3px);
    }

    #app.is-entering.show {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    .app-splash {
      min-height: var(--app-height);
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }

    .shell {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: clamp(14px, 2vw, 18px);
      padding-top: calc(clamp(14px, 2vw, 18px) + var(--safe-top));
      padding-bottom: calc(clamp(14px, 2vw, 18px) + var(--safe-bottom));
    }

    .sk-grid {
      display: grid;
      gap: 12px;
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
        linear-gradient(180deg, rgba(14,33,70,.46), rgba(11,26,54,.26));
      border: 1px solid rgba(189,232,245,.10);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 8px 24px rgba(0,0,0,.10);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      isolation: isolate;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(100%);
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,.04) 18%,
        rgba(255,255,255,.12) 50%,
        rgba(255,255,255,.04) 82%,
        transparent 100%
      );
      animation: shimmer 1.25s cubic-bezier(.4,0,.2,1) infinite;
    }

    @keyframes shimmer {
      100% { transform: translateX(-100%); }
    }

    .sk-box {
      border-radius: 20px;
      min-height: 180px;
      background-color: rgba(255,255,255,.03);
    }

    .sk-line {
      border-radius: 999px;
      min-height: 14px;
      background-color: rgba(255,255,255,.03);
    }

    .sk-card {
      border-radius: 18px;
      min-height: 100px;
      background-color: rgba(255,255,255,.03);
    }

    .sk-pill {
      border-radius: 999px;
      min-height: 38px;
      background-color: rgba(255,255,255,.03);
    }

    .sk-fade {
      opacity: .96;
      animation: fadePulse 1.6s ease-in-out infinite;
    }

    @keyframes fadePulse {
      0%,100% { opacity: .82; }
      50% { opacity: 1; }
    }

    .router-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity .14s ease;
    }

    .router-overlay.visible { opacity: 1; }

    .router-progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, rgba(255,202,40,.95), rgba(255,224,130,.95), rgba(255,202,40,.95));
      background-size: 200% 100%;
      box-shadow: 0 0 10px var(--gold-soft);
      animation: progressSlide 1.2s linear infinite, progressGrow .8s ease-out forwards;
      transform-origin: right center;
      border-radius: 999px;
    }

    @keyframes progressSlide {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes progressGrow {
      0% { width: 0%; }
      30% { width: 45%; }
      80% { width: 82%; }
      100% { width: 94%; }
    }

    .error-card {
      display: grid;
      gap: 14px;
      justify-items: center;
      margin: 40px 20px;
      padding: 24px;
      border: 1px solid rgba(255, 92, 122, 0.22);
      border-radius: 22px;
      background: rgba(127, 29, 29, 0.14);
      color: #ff8aa0;
      align-items: stretch;
      text-align: right;
      box-shadow: 0 0 30px rgba(255, 92, 122, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      max-width: 720px;
      width: 100%;
    }

    .error-card h1 {
      margin: 0;
      font-size: 1.15rem;
      color: #fecaca;
    }

    .error-meta {
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      direction: ltr;
      background: rgba(0,0,0,.28);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.04);
      width: 100%;
      text-align: left;
    }

    .error-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
      justify-content: flex-end;
      width: 100%;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
      touch-action: manipulation;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.16);
    }

    .btn:active { transform: scale(.97); }

    .btn.primary {
      background: rgba(255, 202, 40, .15);
      border-color: rgba(255, 202, 40, .34);
      color: var(--gold);
      box-shadow: 0 0 16px rgba(255,202,40,0.08);
    }

    .btn.primary:hover {
      background: rgba(255, 202, 40, .22);
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton::after,
      .router-progress,
      #app {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app" role="main" aria-live="polite" aria-busy="true"></div>

  <script>
    (function () {
      'use strict';
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        var el = document.activeElement;
        var tag = el && el.tagName ? el.tagName.toUpperCase() : '';
        var typing = tag === 'INPUT' || tag === 'TEXTAREA' || (el && el.isContentEditable);
        if (typing) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
        }
      }, { capture: true, passive: false });
    })();
  </script>

  <script type="module">
    const appRoot = document.getElementById('app');
    const moduleCache = new Map();
    const routeCache = new Map();
    const scrollMemory = new Map();

    let currentCleanup = null;
    let activeNavId = 0;
    let isFirstLoad = true;
    let currentRoutePath = normalizePath(location.pathname);

    const globalStore = {
      userProfile: null,
      lastWatchedAnime: null,
      favorites: [],
      preferences: {},
      ui: {},
      sessionStartedAt: Date.now()
    };

    let auth = null;
    let db = null;
    let storage = null;
    let analytics = null;
    let logAppEvent = () => {};

    import('/api/firebase.js')
      .then((fb) => {
        auth = fb.auth || null;
        db = fb.db || null;
        storage = fb.storage || null;
        analytics = fb.analytics || null;
        logAppEvent = fb.logAppEvent || (() => {});
        console.log('[Boot] Firebase ready');
      })
      .catch(() => console.warn('[Boot] Firebase unavailable'));

    const ROUTES = [
      { path: '/',                     module: '/pages/home.js',          title: 'الرئيسية',         description: 'منصة OraaSlayer للأنمي',       themeColor: '#1C4D8D', skeletonType: 'home' },
      { path: '/home',                 module: '/pages/home.js',          title: 'الرئيسية',         description: 'منصة OraaSlayer للأنمي',       themeColor: '#1C4D8D', skeletonType: 'home' },
      { path: '/login',                module: '/pages/login.js',         title: 'تسجيل الدخول',      description: 'سجل دخولك إلى OraaSlayer',      themeColor: '#0F2854', skeletonType: 'auth' },
      { path: '/register',             module: '/pages/register.js',      title: 'إنشاء حساب',        description: 'أنشئ حسابك في OraaSlayer',      themeColor: '#0F2854', skeletonType: 'auth' },
      { path: '/profile',              module: '/pages/profile.js',       title: 'الملف الشخصي',      auth: true, description: 'ملفك الشخصي',     themeColor: '#0F2854', skeletonType: 'profile' },
      { path: '/anime/:id/:slug',      module: '/pages/anime.js',         title: (ctx) => `أنمي ${ctx.params.slug || ctx.params.id}`, description: 'صفحة الأنمي', themeColor: '#0F2854', skeletonType: 'anime' },
      { path: '/anime/:id',            module: '/pages/anime.js',         title: (ctx) => `أنمي ${ctx.params.id}`, description: 'صفحة الأنمي', themeColor: '#0F2854', skeletonType: 'anime' },
      { path: '/anime',                module: '/pages/anime.js',         title: 'الأنمي',            description: 'تصفح محتوى الأنمي',            themeColor: '#0F2854', skeletonType: 'anime' },
      { path: '/favorites',            module: '/pages/favorites.js',     title: 'المفضلة',           auth: true, description: 'قائمة الأنمي المفضلة', themeColor: '#0F2854', skeletonType: 'list' },
      { path: '/servers/:id/:episode', module: '/pages/servers.js',       title: (ctx) => `سيرفرات ${ctx.params.id} - حلقة ${ctx.params.episode}`, auth: true, description: 'قائمة السيرفرات', themeColor: '#0F2854', skeletonType: 'servers' },
      { path: '/servers/:id',          module: '/pages/servers.js',       title: (ctx) => `سيرفرات ${ctx.params.id}`, auth: true, description: 'قائمة السيرفرات', themeColor: '#0F2854', skeletonType: 'servers' },
      { path: '/servers',              module: '/pages/servers.js',       title: 'السيرفرات',         auth: true, description: 'قائمة السيرفرات', themeColor: '#0F2854', skeletonType: 'servers' },
      { path: '/watch/:id/:episode',   module: '/pages/watch.js',         title: (ctx) => `مشاهدة ${ctx.params.id} حلقة ${ctx.params.episode}`, auth: true, description: 'مشاهدة الحلقة', themeColor: '#0F2854', skeletonType: 'watch' },
      { path: '/watch/:id',            module: '/pages/watch.js',         title: (ctx) => `مشاهدة ${ctx.params.id}`, auth: true, description: 'مشاهدة الأنمي', themeColor: '#0F2854', skeletonType: 'watch' },
      { path: '/watch',                module: '/pages/watch.js',         title: 'المشاهدة',          description: 'شاهد الأنمي',                 themeColor: '#0F2854', skeletonType: 'watch' },
      { path: '/chat',                 module: '/pages/chat.js',          title: 'الدردشة',           auth: true, description: 'دردشة المجتمع',     themeColor: '#0F2854', skeletonType: 'chat' },
      { path: '/redeem',               module: '/pages/redeem_cd.js',     title: 'شحن الكود',         auth: true, description: 'شحن كود الهدية',     themeColor: '#0F2854', skeletonType: 'auth' },
      { path: '/verify',               module: '/pages/verification.js',  title: 'التوثيق',           description: 'مركز التوثيق',               themeColor: '#0F2854', skeletonType: 'auth' },
      { path: '/verification',         module: '/pages/verification.js',  title: 'التوثيق',           description: 'مركز التوثيق',               themeColor: '#0F2854', skeletonType: 'auth' },
      { path: '/newsanime',            module: '/pages/home.js',          title: 'أخبار الأنمي',      description: 'آخر أخبار الأنمي',             themeColor: '#1C4D8D', skeletonType: 'home' },
      { path: '/new',                  module: '/pages/home.js',          title: 'المبدعين',          description: 'مجتمع المبدعين',               themeColor: '#1C4D8D', skeletonType: 'home' },
      { path: '/event_gacha/spin',     module: '/pages/home.js',          title: 'الهدايا والأحداث',   description: 'فعاليات الهدايا',              themeColor: '#1C4D8D', skeletonType: 'home' },
      { path: '/store',                module: '/pages/home.js',          title: 'المتجر',            description: 'متجر OraaSlayer',              themeColor: '#1C4D8D', skeletonType: 'home' },
      { path: '/about',                module: '/pages/home.js',          title: 'عن المنصة',          description: 'عن OraaSlayer',                themeColor: '#1C4D8D', skeletonType: 'home' },
      { path: '/policy',               module: '/pages/home.js',          title: 'سياسة الخصوصية',     description: 'سياسة الخصوصية',               themeColor: '#1C4D8D', skeletonType: 'home' },
      { path: '/download',             module: '/pages/home.js',          title: 'تحميل التطبيق',      description: 'حمل تطبيق OraaSlayer',         themeColor: '#1C4D8D', skeletonType: 'home' },
      { path: '/settings',             module: '/pages/home.js',          title: 'الإعدادات',          description: 'إعدادات الحساب',               themeColor: '#1C4D8D', skeletonType: 'home' }
    ];

    const COMPILED_ROUTES = ROUTES.map((route) => {
      const compiled = compileRoutePattern(route.path);
      return { ...route, regex: compiled.regex, keys: compiled.keys };
    });

    try {
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    } catch (_) {}

    function normalizePath(pathname) {
      let path = pathname || '/';
      try { path = decodeURI(path); } catch (_) {}
      path = path.replace(/\/{2,}/g, '/');
      if (path === '/index.html' || path.endsWith('/index.html')) path = '/';
      if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
      return path || '/';
    }

    function splitUrl(raw) {
      const url = new URL(raw, location.origin);
      return {
        pathname: normalizePath(url.pathname),
        search: url.search,
        hash: url.hash,
        url
      };
    }

    function compileRoutePattern(pattern) {
      const keys = [];
      const clean = normalizePath(pattern);
      const parts = clean.split('/').filter(Boolean).map((segment) => {
        if (segment.startsWith(':')) {
          keys.push(segment.slice(1));
          return '([^\\/]+)';
        }
        return segment.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      });
      const regex = parts.length ? new RegExp(`^/${parts.join('/')}$`) : /^\/$/;
      return { regex, keys };
    }

    function matchRoute(pathname) {
      const path = normalizePath(pathname);
      if (routeCache.has(path)) return routeCache.get(path);
      for (const route of COMPILED_ROUTES) {
        const match = path.match(route.regex);
        if (!match) continue;
        const params = {};
        route.keys.forEach((key, index) => {
          params[key] = match[index + 1] ? decodeURIComponent(match[index + 1]) : '';
        });
        const resolved = { ...route, params };
        routeCache.set(path, resolved);
        return resolved;
      }
      routeCache.set(path, null);
      return null;
    }

    function getAuthUser() {
      try {
        const authState = window.__AUTH__;
        if (authState?.isLoggedIn && authState?.user) return authState.user;
        if (typeof auth === 'function') return auth()?.currentUser ?? null;
        return auth?.currentUser ?? null;
      } catch {
        return null;
      }
    }

    function routeTitle(route, ctx) {
      const title = route?.title;
      if (typeof title === 'function') return title(ctx);
      if (typeof title === 'string' && title.trim()) return title;
      return route?.path === '/' ? 'الرئيسية' : 'OraaSlayer';
    }

    function routeDescription(route) {
      return (typeof route?.description === 'string' && route.description.trim())
        ? route.description.trim()
        : 'منصة OraaSlayer للأنمي';
    }

    function routeThemeColor(route) {
      return (typeof route?.themeColor === 'string' && route.themeColor.trim())
        ? route.themeColor.trim()
        : '#0F2854';
    }

    function setMeta(name, content) {
      let el = document.head.querySelector(`meta[name="${name}"]`);
      if (!el) {
        el = document.createElement('meta');
        el.setAttribute('name', name);
        document.head.appendChild(el);
      }
      el.setAttribute('content', content);
    }

    function setMetaProperty(property, content) {
      let el = document.head.querySelector(`meta[property="${property}"]`);
      if (!el) {
        el = document.createElement('meta');
        el.setAttribute('property', property);
        document.head.appendChild(el);
      }
      el.setAttribute('content', content);
    }

    function updateMetaTags(meta = {}) {
      document.title = meta.title || 'OraaSlayer';
      const desc = meta.description || 'منصة OraaSlayer للأنمي';
      const color = meta.themeColor || '#0F2854';
      setMeta('description', desc);
      setMeta('theme-color', color);
      setMetaProperty('og:title', meta.title || 'OraaSlayer');
      setMetaProperty('og:description', desc);
      setMetaProperty('twitter:title', meta.title || 'OraaSlayer');
      setMetaProperty('twitter:description', desc);
    }

    function safeLogEvent(name, payload) {
      try {
        if (typeof logAppEvent === 'function') logAppEvent(name, payload);
      } catch (_) {}
    }

    function createContext(route, rawUrl, registerCleanup) {
      const { url, search } = splitUrl(rawUrl || location.href);
      const query = Object.fromEntries(url.searchParams.entries());
      route = route || {};
      route.params = route.params || {};

      if (!route.params.id && query.id) route.params.id = query.id;
      if (!route.params.episode && query.ep) route.params.episode = query.ep;
      if (!route.params.server && query.srv) route.params.server = query.srv;

      return {
        root: null,
        mount: null,
        route,
        path: route?.path || normalizePath(url.pathname),
        params: { ...(route?.params || {}) },
        query,
        searchParams: url.searchParams,
        hash: url.hash,
        url,
        auth,
        db,
        storage,
        analytics,
        store: globalStore,
        setStore(patch = {}) {
          Object.assign(globalStore, patch);
          return globalStore;
        },
        updateStore(mutator) {
          if (typeof mutator === 'function') mutator(globalStore);
          return globalStore;
        },
        onCleanup: registerCleanup,
        go: navigate,
        replace: replaceNavigate,
        reload: () => loadPage(location.href, { replace: true, restoreScroll: false }),
        logEvent: safeLogEvent,
        search
      };
    }

    async function ensureModule(modulePath) {
      if (!modulePath) throw new Error('No module path found for this route.');
      if (moduleCache.has(modulePath)) return moduleCache.get(modulePath);
      const promise = import(modulePath).catch((err) => {
        moduleCache.delete(modulePath);
        throw err;
      });
      moduleCache.set(modulePath, promise);
      return promise;
    }

    function getPageHandler(mod) {
      return mod?.default || mod?.render || mod?.page || (typeof mod === 'function' ? mod : null);
    }

    function resolveModuleMeta(mod, route, ctx) {
      const modMeta = mod?.meta || {};
      const title =
        (typeof modMeta.title === 'function' ? modMeta.title(ctx) : modMeta.title) ||
        (typeof mod?.title === 'function' ? mod.title(ctx) : mod?.title) ||
        routeTitle(route, ctx);

      const description =
        (typeof modMeta.description === 'function' ? modMeta.description(ctx) : modMeta.description) ||
        (typeof mod?.description === 'function' ? mod.description(ctx) : mod?.description) ||
        routeDescription(route);

      const themeColor =
        (typeof modMeta.themeColor === 'function' ? modMeta.themeColor(ctx) : modMeta.themeColor) ||
        (typeof mod?.themeColor === 'function' ? mod.themeColor(ctx) : mod?.themeColor) ||
        routeThemeColor(route);

      return { title, description, themeColor };
    }

    function createSkeletonBox({ className = 'sk-box', style = '' } = {}) {
      const el = document.createElement('div');
      el.className = `skeleton ${className}`;
      if (style) el.style.cssText = style;
      return el;
    }

    function createSkeletonLine(width = '100%', height = '14px', style = '') {
      const el = document.createElement('div');
      el.className = 'skeleton sk-line';
      el.style.cssText = `width:${width};height:${height};${style}`;
      return el;
    }

    function createSkeletonCard(style = '') {
      const el = document.createElement('div');
      el.className = 'skeleton sk-card';
      if (style) el.style.cssText = style;
      return el;
    }

    function buildSpecificSkeleton(type = 'home') {
      const wrap = document.createElement('div');
      wrap.className = 'shell sk-fade';

      switch (type) {
        case 'anime': {
          const top = document.createElement('div');
          top.style.cssText = 'display:flex;gap:16px;align-items:flex-start;margin-bottom:16px;';
          top.appendChild(createSkeletonBox({ style: 'width:140px;min-width:140px;height:210px;border-radius:18px;' }));

          const right = document.createElement('div');
          right.style.cssText = 'flex:1;display:grid;gap:12px;padding-top:4px;';
          right.appendChild(createSkeletonLine('72%', '22px'));
          right.appendChild(createSkeletonLine('42%'));
          right.appendChild(createSkeletonLine('92%'));
          right.appendChild(createSkeletonLine('88%'));
          right.appendChild(createSkeletonLine('60%'));
          top.appendChild(right);

          const chips = document.createElement('div');
          chips.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px;';
          chips.appendChild(createSkeletonCard('width:92px;height:36px;border-radius:999px;'));
          chips.appendChild(createSkeletonCard('width:110px;height:36px;border-radius:999px;'));
          chips.appendChild(createSkeletonCard('width:86px;height:36px;border-radius:999px;'));

          const rows = document.createElement('div');
          rows.className = 'sk-grid';
          rows.style.cssText = 'grid-template-columns:repeat(4, minmax(0, 1fr));';
          for (let i = 0; i < 4; i++) rows.appendChild(createSkeletonCard('height:56px;'));

          wrap.append(top, chips, createSkeletonLine('28%', '18px', 'margin:12px 0 8px;'), rows);
          break;
        }

        case 'servers':
        case 'watch': {
          wrap.appendChild(createSkeletonBox({ style: 'height:280px;border-radius:22px;margin-bottom:14px;' }));

          const row = document.createElement('div');
          row.style.cssText = 'display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;';
          row.appendChild(createSkeletonCard('height:44px;'));
          row.appendChild(createSkeletonCard('height:44px;'));
          row.appendChild(createSkeletonCard('height:44px;'));
          wrap.appendChild(row);
          wrap.appendChild(createSkeletonLine('48%', '16px', 'margin-top:16px;'));
          break;
        }

        case 'auth': {
          const box = document.createElement('div');
          box.style.cssText = 'max-width:520px;margin:0 auto;';
          box.appendChild(createSkeletonLine('44%', '24px', 'margin:0 auto 18px;'));
          box.appendChild(createSkeletonCard('height:52px;margin-bottom:14px;border-radius:16px;'));
          box.appendChild(createSkeletonCard('height:52px;margin-bottom:14px;border-radius:16px;'));
          box.appendChild(createSkeletonCard('height:52px;border-radius:16px;'));
          wrap.appendChild(box);
          break;
        }

        case 'profile': {
          const box = document.createElement('div');
          box.style.cssText = 'display:grid;place-items:center;gap:12px;margin-bottom:20px;';
          box.appendChild(createSkeletonCard('width:84px;height:84px;border-radius:50%;'));
          box.appendChild(createSkeletonLine('38%', '18px'));
          box.appendChild(createSkeletonLine('22%', '14px'));
          wrap.appendChild(box);

          const cards = document.createElement('div');
          cards.className = 'sk-grid';
          cards.style.cssText = 'grid-template-columns:repeat(3, minmax(0, 1fr));';
          cards.appendChild(createSkeletonCard('height:88px;'));
          cards.appendChild(createSkeletonCard('height:88px;'));
          cards.appendChild(createSkeletonCard('height:88px;'));
          wrap.appendChild(cards);
          break;
        }

        case 'chat': {
          wrap.appendChild(createSkeletonBox({ style: 'height:74vh;border-radius:22px;margin-bottom:14px;' }));
          wrap.appendChild(createSkeletonCard('height:54px;border-radius:18px;'));
          break;
        }

        case 'list':
        default: {
          wrap.appendChild(createSkeletonBox({ style: 'height:clamp(190px, 38vw, 360px);border-radius:22px;margin-bottom:14px;' }));
          wrap.appendChild(createSkeletonLine('42%', '18px', 'margin:12px auto 12px;'));
          wrap.appendChild(createSkeletonLine('60%', '14px', 'margin:0 auto 16px;'));
          const grid = document.createElement('div');
          grid.className = 'sk-grid';
          grid.style.cssText = 'grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));margin-top:14px;';
          for (let i = 0; i < 8; i++) grid.appendChild(createSkeletonCard('aspect-ratio:2/3;'));
          wrap.appendChild(grid);
          break;
        }
      }

      return wrap;
    }

    function resolveSkeleton(route, mod, ctx) {
      const candidate =
        mod?.skeleton ||
        mod?.loading ||
        route?.skeleton ||
        route?.loading ||
        window.ROUTER_SKELETONS?.[route?.module];

      if (typeof candidate === 'function') {
        const r = candidate(ctx);
        if (r instanceof DocumentFragment || r instanceof Node) return r;
        if (typeof r === 'string') {
          const d = document.createElement('div');
          d.innerHTML = r;
          return d;
        }
      }

      if (candidate instanceof DocumentFragment || candidate instanceof Node) return candidate;

      if (typeof candidate === 'string') {
        const d = document.createElement('div');
        d.innerHTML = candidate;
        return d;
      }

      return buildSpecificSkeleton(route?.skeletonType || 'home');
    }

    function showProgressBar() {
      if (appRoot.querySelector('[data-router-overlay="1"]')) return;
      const overlay = document.createElement('div');
      overlay.className = 'router-overlay';
      overlay.dataset.routerOverlay = '1';
      const progress = document.createElement('div');
      progress.className = 'router-progress';
      overlay.appendChild(progress);
      appRoot.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('visible'));
    }

    function hideProgressBar() {
      const overlay = appRoot.querySelector('[data-router-overlay="1"]');
      if (!overlay) return;
      overlay.classList.remove('visible');
      setTimeout(() => {
        if (overlay.parentNode) overlay.remove();
      }, 180);
    }

    function renderError(err, route, rawUrl) {
      const wrapper = document.createElement('div');
      wrapper.className = 'app-splash';

      const card = document.createElement('div');
      card.className = 'error-card';

      const title = document.createElement('h1');
      const msg = String(err?.message || err || 'خطأ غير معروف').toLowerCase();

      title.textContent =
        msg.includes('404') || msg.includes('not found') || !route
          ? 'الصفحة غير موجودة'
          : msg.includes('failed to fetch') || msg.includes('networkerror') || msg.includes('import')
          ? 'فشل تحميل الصفحة'
          : 'حدث خطأ ما';

      const info = document.createElement('p');
      info.textContent = route ? `المسار: ${route.path}` : `الرابط: ${splitUrl(rawUrl || location.href).pathname}`;

      const details = document.createElement('div');
      details.className = 'error-meta';
      details.textContent = String(err?.stack || err?.message || err || '').trim() || 'لا توجد تفاصيل إضافية متاحة عن هذا الخطأ.';

      const actions = document.createElement('div');
      actions.className = 'error-actions';

      const retryBtn = document.createElement('button');
      retryBtn.type = 'button';
      retryBtn.className = 'btn primary';
      retryBtn.textContent = 'إعادة المحاولة';
      retryBtn.addEventListener('click', () => loadPage(location.href, { replace: true, restoreScroll: false }));

      const homeBtn = document.createElement('button');
      homeBtn.type = 'button';
      homeBtn.className = 'btn';
      homeBtn.textContent = 'العودة للرئيسية';
      homeBtn.addEventListener('click', () => navigate('/'));

      actions.append(retryBtn, homeBtn);
      card.append(title, info, details, actions);
      wrapper.appendChild(card);

      appRoot.replaceChildren(wrapper);
      appRoot.setAttribute('aria-busy', 'false');
      updateMetaTags({ title: 'خطأ - OraaSlayer', description: 'حدث خطأ أثناء تحميل الصفحة.', themeColor: '#0F2854' });
    }

    function renderNotAuthorized(redirectTo) {
      const wrapper = document.createElement('div');
      wrapper.className = 'app-splash';

      const card = document.createElement('div');
      card.className = 'error-card';

      const title = document.createElement('h1');
      title.textContent = 'يتطلب تسجيل الدخول';

      const info = document.createElement('p');
      info.textContent = 'هذه الصفحة محمية. يرجى تسجيل الدخول للمتابعة.';

      const actions = document.createElement('div');
      actions.className = 'error-actions';

      const loginBtn = document.createElement('button');
      loginBtn.type = 'button';
      loginBtn.className = 'btn primary';
      loginBtn.textContent = 'تسجيل الدخول';
      loginBtn.addEventListener('click', () => navigate(redirectTo ? `/login?redirect=${encodeURIComponent(redirectTo)}` : '/login'));

      const homeBtn = document.createElement('button');
      homeBtn.type = 'button';
      homeBtn.className = 'btn';
      homeBtn.textContent = 'العودة للرئيسية';
      homeBtn.addEventListener('click', () => navigate('/'));

      actions.append(loginBtn, homeBtn);
      card.append(title, info, actions);
      wrapper.appendChild(card);

      appRoot.replaceChildren(wrapper);
      appRoot.setAttribute('aria-busy', 'false');
      updateMetaTags({ title: 'يتطلب تسجيل الدخول - OraaSlayer', description: 'يرجى تسجيل الدخول للوصول.', themeColor: '#0F2854' });
    }

    function saveCurrentScrollForRoute(pathname) {
      scrollMemory.set(normalizePath(pathname), window.scrollY || 0);
      try {
        history.replaceState(
          { ...(history.state || {}), path: normalizePath(pathname), scrollY: window.scrollY || 0 },
          '',
          location.href
        );
      } catch (_) {}
    }

    function applyRouteScroll(routePath, restoreScroll, scrollY) {
      if (typeof scrollY === 'number' && !Number.isNaN(scrollY)) {
        window.scrollTo({ top: scrollY, left: 0, behavior: 'auto' });
        return;
      }
      if (restoreScroll && scrollMemory.has(routePath)) {
        window.scrollTo({ top: scrollMemory.get(routePath) || 0, left: 0, behavior: 'auto' });
        return;
      }
      window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
    }

    function normalizeHref(href) {
      if (!href) return null;
      try {
        const url = new URL(href, location.origin);
        if (url.origin !== location.origin) return null;
        return `${normalizePath(url.pathname)}${url.search}${url.hash}`;
      } catch {
        return null;
      }
    }

    function persistScrollBeforeNavigation() {
      saveCurrentScrollForRoute(location.pathname);
    }

    function navigate(path) {
      const href = normalizeHref(path);
      if (!href) return;
      const next = splitUrl(href);
      const current = splitUrl(location.href);

      if (current.pathname === next.pathname && current.search === next.search && current.hash === next.hash) return;

      persistScrollBeforeNavigation();
      history.pushState({ path: next.pathname, scrollY: 0 }, '', href);
      loadPage(href, { action: 'push', saveScroll: true, restoreScroll: false });
    }

    function replaceNavigate(path) {
      const href = normalizeHref(path);
      if (!href) return;
      persistScrollBeforeNavigation();
      const next = splitUrl(href);
      history.replaceState({ path: next.pathname, scrollY: 0 }, '', href);
      loadPage(href, { action: 'replace', saveScroll: false, restoreScroll: false });
    }

    async function prefetchByHref(href) {
      const normalized = normalizeHref(href);
      if (!normalized) return;
      const { pathname } = splitUrl(normalized);
      const route = matchRoute(pathname);
      if (!route || (route.auth && !getAuthUser())) return;
      try {
        await ensureModule(route.module);
      } catch (_) {}
    }

    function onLinkClick(e) {
      const link = e.target.closest?.('a[data-link]');
      if (!link) return;

      const href = link.getAttribute('href');
      if (!href) return;

      if (
        href.startsWith('http:') ||
        href.startsWith('https:') ||
        href.startsWith('mailto:') ||
        href.startsWith('tel:') ||
        href.startsWith('#')
      ) return;

      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

      e.preventDefault();
      navigate(href);
    }

    function onLinkHover(e) {
      const link = e.target.closest?.('a[data-link]');
      if (!link) return;
      const href = link.getAttribute('href');
      if (!href) return;

      if (
        href.startsWith('http:') ||
        href.startsWith('https:') ||
        href.startsWith('mailto:') ||
        href.startsWith('tel:') ||
        href.startsWith('#')
      ) return;

      prefetchByHref(href);
    }

    async function loadPage(rawUrl, options = {}) {
      const navId = ++activeNavId;
      const startedAt = performance.now();

      const { pathname, search, hash } = splitUrl(rawUrl);
      const urlObj = new URL(rawUrl, location.origin);
      const queryParams = Object.fromEntries(urlObj.searchParams.entries());

      if (queryParams.id && (pathname === '/watch' || pathname.startsWith('/watch') || pathname === '/servers' || pathname.startsWith('/servers'))) {
        let newPath = pathname.includes('watch') ? `/watch/${queryParams.id}` : `/servers/${queryParams.id}`;
        if (queryParams.ep) newPath += `/${queryParams.ep}`;

        const remainingParams = new URLSearchParams(urlObj.searchParams);
        remainingParams.delete('id');
        remainingParams.delete('ep');

        const remainingSearch = remainingParams.toString();
        const fullRedirect = `${newPath}${remainingSearch ? '?' + remainingSearch : ''}${hash}`;

        history.replaceState({ path: newPath, scrollY: 0 }, '', fullRedirect);
        loadPage(fullRedirect, { ...options, action: options.action || 'replace' });
        return;
      }

      const route = matchRoute(pathname);
      const fullPath = `${pathname}${search}${hash}`;

      if (!route) {
        renderError(new Error(`Route not found: ${pathname}`), null, rawUrl);
        return;
      }

      const user = getAuthUser();
      if (route.auth && !user) {
        renderNotAuthorized(fullPath);
        return;
      }

      const previousPath = currentRoutePath;
      currentRoutePath = pathname;

      if (options.saveScroll !== false) saveCurrentScrollForRoute(previousPath);
      safeLogEvent('route_change', { from: previousPath, to: pathname, action: options.action || 'load' });

      if (typeof currentCleanup === 'function') {
        try { await currentCleanup(); } catch (_) {}
        currentCleanup = null;
      }

      appRoot.classList.add('is-navigating');
      const skeletonNode = resolveSkeleton(route, null, { route, params: route.params, query: queryParams });
      appRoot.replaceChildren(skeletonNode);
      appRoot.setAttribute('aria-busy', 'true');
      requestAnimationFrame(() => appRoot.classList.remove('is-navigating'));

      if (!isFirstLoad) showProgressBar();

      const modulePromise = ensureModule(route.module);

      try {
        const mod = await modulePromise;
        if (navId !== activeNavId) return;

        const page = getPageHandler(mod);
        if (typeof page !== 'function') {
          throw new Error(`Module "${route.module}" must export a default async function render(ctx).`);
        }

        let pageCleanup = null;
        const ctx = createContext(route, rawUrl, (fn) => { pageCleanup = fn; });
        const meta = resolveModuleMeta(mod, route, ctx);
        updateMetaTags(meta);

        const stage = document.createElement('div');
        stage.setAttribute('data-router-stage', '1');
        stage.style.display = 'contents';
        ctx.root = stage;
        ctx.mount = stage;

        const pageResult = await page(ctx);
        if (navId !== activeNavId) return;

        if (typeof pageResult === 'string') {
          stage.innerHTML = pageResult;
        } else if (pageResult instanceof DocumentFragment) {
          stage.appendChild(pageResult);
        } else if (pageResult instanceof Node) {
          stage.appendChild(pageResult);
        } else if (pageResult?.html && typeof pageResult.html === 'string') {
          stage.innerHTML = pageResult.html;
        }

        const fragment = document.createDocumentFragment();
        while (stage.firstChild) fragment.appendChild(stage.firstChild);

        appRoot.replaceChildren(fragment);
        appRoot.classList.add('is-entering');
        appRoot.setAttribute('aria-busy', 'false');

        requestAnimationFrame(() => {
          if (navId !== activeNavId) return;
          requestAnimationFrame(() => appRoot.classList.add('show'));
        });

        setTimeout(() => appRoot.classList.remove('is-entering', 'show'), 240);

        currentCleanup = pageCleanup;

        if (window.lucide?.createIcons) window.lucide.createIcons();

        const duration = Math.round(performance.now() - startedAt);
        safeLogEvent('page_load_time', {
          path: pathname,
          route: route.path,
          module: route.module,
          duration,
          protected: !!route.auth
        });
        safeLogEvent('user_flow', { from: previousPath, to: pathname, type: 'spa_navigation' });

        applyRouteScroll(pathname, options.restoreScroll === true, options.scrollY);
        isFirstLoad = false;
      } catch (err) {
        if (navId !== activeNavId) return;
        appRoot.classList.remove('is-navigating', 'is-entering');
        appRoot.setAttribute('aria-busy', 'false');
        console.error('[Router Error]', err);
        renderError(err, route, rawUrl);
      } finally {
        hideProgressBar();
      }
    }

    function initRouterShell() {
      document.addEventListener('click', onLinkClick, true);
      document.addEventListener('mouseover', onLinkHover, true);

      window.addEventListener('popstate', (event) => {
        loadPage(location.href, {
          action: 'pop',
          saveScroll: false,
          restoreScroll: true,
          scrollY: typeof event.state?.scrollY === 'number' ? event.state.scrollY : undefined
        });
      });

      window.addEventListener('beforeunload', () => {
        if (typeof currentCleanup === 'function') {
          try { currentCleanup(); } catch (_) {}
        }
        routeCache.clear();
        scrollMemory.clear();
      });

      if (normalizePath(location.pathname) === '/index.html') {
        history.replaceState({ path: '/', scrollY: 0 }, '', '/');
      } else {
        try {
          history.replaceState({ ...(history.state || {}), path: normalizePath(location.pathname), scrollY: window.scrollY || 0 }, '', location.href);
        } catch (_) {}
      }

      window.go = navigate;
      window.navigate = navigate;
      window.replaceGo = replaceNavigate;

      window.router = {
        go: navigate,
        replace: replaceNavigate,
        preload: prefetchByHref,
        store: globalStore,
        routes: ROUTES,
        cleanup: () => {
          if (typeof currentCleanup === 'function') {
            try { currentCleanup(); } catch (_) {}
          }
        }
      };

      loadPage(location.href, { action: 'init', saveScroll: false, restoreScroll: false });
      safeLogEvent('app_start', {
        version: 'router-shell-v10',
        platform: 'web',
        path: normalizePath(location.pathname)
      });
    }

    initRouterShell();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
